services:
  postgres:
    image: postgres:17
    container_name: school-erp-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: school_erp
      POSTGRES_USER: school_erp
      POSTGRES_PASSWORD: school_erp_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_erp -d school_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: